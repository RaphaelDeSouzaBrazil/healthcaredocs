<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Uploads | SmartDocs</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <style>
      :root {
        --sidebar-width: 270px;
        --sidebar-bg: #0b1324;
        --sidebar-secondary: #111c32;
      }

      body {
        margin: 0;
      }

      /*
      =====================================================
      SIDEBAR
      =====================================================
      */

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;

        width: var(--sidebar-width);

        background: var(--sidebar-bg);

        color: white;

        overflow-y: auto;

        z-index: 1000;

        display: flex;
        flex-direction: column;
      }

      .sidebar-header {
        padding: 26px 24px 20px;

        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-icon {
        width: 42px;
        height: 42px;

        border-radius: 12px;

        background: linear-gradient(135deg, #2563eb, #4f8cff);

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 20px;

        box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3);
      }

      .brand-name {
        font-size: 19px;
        font-weight: 750;
        letter-spacing: -0.4px;
      }

      .brand-description {
        font-size: 10px;

        color: #8fa0ba;

        margin-top: 2px;

        text-transform: uppercase;

        letter-spacing: 0.8px;
      }

      .sidebar-nav {
        padding: 20px 14px;

        flex: 1;
      }

      .menu-section {
        font-size: 10px;

        color: #657691;

        font-weight: 700;

        letter-spacing: 1.2px;

        text-transform: uppercase;

        padding: 18px 14px 8px;
      }

      .nav-item-link {
        display: flex;
        align-items: center;

        gap: 13px;

        padding: 11px 14px;

        margin: 3px 0;

        color: #aab7ca;

        text-decoration: none;

        border-radius: 10px;

        transition: all 0.2s;

        font-size: 14px;
      }

      .nav-item-link i {
        width: 20px;

        font-size: 17px;
      }

      .nav-item-link:hover {
        color: white;

        background: rgba(255, 255, 255, 0.06);
      }

      .nav-item-link.active {
        background: linear-gradient(
          90deg,
          rgba(37, 99, 235, 0.24),
          rgba(37, 99, 235, 0.08)
        );

        color: white;
      }

      .nav-item-link.active i {
        color: #75a7ff;
      }

      .sidebar-footer {
        margin: 15px;

        padding: 15px;

        border-radius: 12px;

        background: var(--sidebar-secondary);
      }

      .sidebar-footer small {
        color: #8190a5;
      }

      /*
      =====================================================
      CONTEÚDO ORIGINAL
      =====================================================
      */

      .app-content {
        margin-left: var(--sidebar-width);

        min-height: 100vh;
      }

      /*
      =====================================================
      MOBILE
      =====================================================
      */

      .mobile-menu-button {
        display: none;
      }

      @media (max-width: 991px) {
        .sidebar {
          transform: translateX(-100%);
          transition: transform 0.25s ease;
        }

        .sidebar.open {
          transform: translateX(0);
        }

        .app-content {
          margin-left: 0;
        }

        .mobile-menu-button {
          display: inline-flex;

          position: fixed;

          top: 15px;
          left: 15px;

          z-index: 1100;

          width: 42px;
          height: 42px;

          align-items: center;
          justify-content: center;

          border: 1px solid #dee2e6;

          background: white;

          border-radius: 8px;

          box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .app-content .container {
          padding-top: 75px !important;
        }
      }
    </style>
  </head>

  <body class="bg-light">
    <!-- =====================================================
    MENU MOBILE
    ====================================================== -->

    <button type="button" class="mobile-menu-button" id="btnMobileMenu">
      <i class="bi bi-list"></i>
    </button>

    <!-- =====================================================
    SIDEBAR
    ====================================================== -->

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon">
            <i class="bi bi-file-earmark-medical"></i>
          </div>

          <div>
            <div class="brand-name">SmartDocs</div>

            <div class="brand-description">Healthcare Intelligence</div>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="menu-section">Principal</div>

        <a href="./dashboard.html" class="nav-item-link">
          <i class="bi bi-grid"></i>
          Dashboard
        </a>

        <a href="./upload.html" class="nav-item-link active">
          <i class="bi bi-cloud-arrow-up"></i>
          Novo processamento
        </a>

        <a href="#" class="nav-item-link">
          <i class="bi bi-files"></i>
          Documentos
        </a>

        <a href="#" class="nav-item-link">
          <i class="bi bi-diagram-3"></i>
          Processos
        </a>

        <div class="menu-section">Saúde</div>

        <a href="#" class="nav-item-link">
          <i class="bi bi-clipboard2-pulse"></i>
          Processos clínicos
        </a>

        <a href="#" class="nav-item-link">
          <i class="bi bi-heart-pulse"></i>
          Atendimentos
        </a>

        <a href="#" class="nav-item-link">
          <i class="bi bi-people"></i>
          Pacientes
        </a>

        <a href="#" class="nav-item-link">
          <i class="bi bi-shield-check"></i>
          Auditoria clínica
        </a>

        <div class="menu-section">Administração</div>

        <a href="#" class="nav-item-link">
          <i class="bi bi-bar-chart"></i>
          Relatórios
        </a>

        <a href="#" class="nav-item-link">
          <i class="bi bi-person-gear"></i>
          Usuários
        </a>

        <a href="#" class="nav-item-link">
          <i class="bi bi-gear"></i>
          Configurações
        </a>
      </nav>

      <div class="sidebar-footer">
        <small> SmartDocs API </small>

        <div class="mt-1" style="font-size: 12px; font-weight: 650">
          <span
            style="
              display: inline-block;
              width: 7px;
              height: 7px;
              border-radius: 100%;
              background: #21c987;
              margin-right: 6px;
            "
          ></span>

          Sistema conectado
        </div>
      </div>
    </aside>

    <!-- =====================================================
    CONTEÚDO ORIGINAL
    ====================================================== -->

    <main class="app-content">
      <div class="container py-5">
        <h1 class="mb-4">Upload de Documentos</h1>

        <div class="card">
          <div class="card-body">
            <input id="documentos" class="form-control" type="file" multiple />

            <button
              id="btnEnviar"
              onclick="return false;"
              type="button"
              class="btn btn-primary mt-3"
            >
              Enviar Arquivos
            </button>
          </div>
        </div>

        <div id="resultado" class="mt-4"></div>
      </div>
    </main>

    <!-- =====================================================
    MENU MOBILE
    ====================================================== -->

    <script>
      const btnMobileMenu = document.getElementById("btnMobileMenu");

      const sidebar = document.getElementById("sidebar");

      if (btnMobileMenu && sidebar) {
        btnMobileMenu.addEventListener("click", function () {
          sidebar.classList.toggle("open");
        });
      }
    </script>

    <!-- =====================================================
    SEU JS ORIGINAL
    ====================================================== -->

    <script src="../js/upload.js"></script>
  </body>
</html>
